<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>Little Elm TSA — STEM, Competitions & Leadership</title>
    <meta name="description" content="Little Elm High School Technology Student Association. Compete. Innovate. Lead. Join Texas's most driven TSA chapter." />
    <meta name="theme-color" content="#005DAA" />
    <meta name="color-scheme" content="dark light" />

    <!-- Favicon -->
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Little Elm TSA — STEM, Competitions & Leadership" />
    <meta property="og:description" content="Student-run TSA chapter at Little Elm High School. Competitions, leadership, and innovation in STEM." />
    <meta property="og:image" content="/assets/og-image.png" />
    <meta property="og:url" content="https://lehstsa.com" />
    <meta property="og:site_name" content="Little Elm TSA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Little Elm TSA" />
    <meta name="twitter:description" content="Compete. Innovate. Lead. Little Elm High School TSA." />
    <meta name="twitter:image" content="/assets/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://lehstsa.com" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Little Elm High School TSA",
      "url": "https://lehstsa.com",
      "logo": "https://lehstsa.com/assets/favicon.svg",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "lehstsa@gmail.com",
        "contactType": "student organization"
      },
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "1600 Walker Lane",
        "addressLocality": "Little Elm",
        "addressRegion": "TX",
        "postalCode": "75068"
      }
    }
    </script>

    <!-- Fonts: Source Sans Pro (body) + JetBrains Mono (code) | Proxima Nova via Typekit (headings, fallback: Franklin Gothic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700;1,900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
